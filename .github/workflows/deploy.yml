name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/web-game-discussion-neyhwa
  # Lets you redeploy by hand from the Actions tab.
  workflow_dispatch:

# Pages deployments need these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but don't cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - run: npm run build

      - name: Configure Pages
        # enablement turns Pages on for the repo if it is not already.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

# Runs on every push and every pull request, so a broken production line is
# caught on the branch rather than on the way to the live site.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Simulation tests
        run: npm test

      - name: Build
        run: npm run build
